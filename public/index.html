  <header class="top">
    <div class="brand">
      <div class="logo">HQ</div>
      <div>
        <div class="greet" id="greet">Good morning</div>
        <div class="date" id="date"></div>
        <div class="local-wx" id="localWx"></div>
      </div>
    </div>
    <div class="spacer-flex"></div>
    <div class="top-actions">
      <button class="icon-btn bell-btn" id="bellBtn" title="Alerts" aria-label="Alerts"><svg class="ic"><use href="#i-bell"/></svg><i class="bell-badge" id="bellBadge" hidden></i></button>
      <button class="icon-btn apps-btn" id="appsBtn" title="Your apps" aria-label="Your apps"><svg class="ic"><use href="#i-layout-grid"/></svg></button>
      <button class="icon-btn" id="refreshAll" title="Refresh everything (R)" aria-label="Refresh"><svg class="ic"><use href="#i-refresh-cw"/></svg></button>
      <button class="icon-btn" id="openSettings" title="Customize (S)" aria-label="Customize"><svg class="ic"><use href="#i-settings"/></svg></button>
    </div>
  </header>

  <div class="apps-pop" id="appsPop" hidden></div>
  <div class="apps-pop bell-pop" id="bellPop" hidden aria-label="Alerts"></div>

  <div class="ticker" id="ticker" aria-label="Market ticker"><div class="ticker-track" id="tickerTrack"></div></div>

  <nav class="jump" id="jump"></nav>

  <nav class="apps-bar" id="appsBar" aria-label="Your apps"></nav>

  <main class="grid" id="grid"></main>

  <section class="more-panel" id="more" aria-label="More"></section>

  <nav class="tabbar" id="tabbar" aria-label="Sections">
    <button data-view="home" class="on"><svg class="ic tb-i"><use href="#i-house"/></svg>Home</button>
    <button data-view="sports"><svg class="ic tb-i"><use href="#i-trophy"/></svg>Scores<i class="badge live" id="tb-sports" hidden></i></button>
    <button data-view="weather"><svg class="ic tb-i"><use href="#i-cloud-sun"/></svg>Weather<i class="badge warn" id="tb-weather" hidden></i></button>
    <button data-view="news"><svg class="ic tb-i"><use href="#i-newspaper"/></svg>News<i class="badge" id="tb-news" hidden></i></button>
    <button data-view="markets"><svg class="ic tb-i"><use href="#i-trending-up"/></svg>Markets</button>
    <button data-view="more"><svg class="ic tb-i"><use href="#i-menu"/></svg>More</button>
  </nav>

  <footer class="foot">
    Scores & logos: ESPN · Weather: Open-Meteo · Weather icons: Meteocons · Icons: Lucide · Quotes: Yahoo Finance (may be delayed) · News: publisher RSS feeds.
    Settings are saved in this browser — use <a href="#" id="footSettings">Customize → General → Backup</a> to move them to another device.
  </footer>

  <!-- Settings drawer -->
  <div class="scrim" id="scrim" hidden></div>
  <aside class="drawer" id="drawer" aria-hidden="true">
    <div class="drawer-head">
      <h2>Customize</h2>
      <button class="icon-btn" id="closeSettings" aria-label="Close"><svg class="ic"><use href="#i-x"/></svg></button>
    </div>
    <div class="drawer-tabs" id="drawerTabs">
      <button data-tab="general" class="on">General</button>
      <button data-tab="sports">Sports</button>
      <button data-tab="news">News</button>
      <button data-tab="weather">Weather</button>
      <button data-tab="markets">Markets</button>
      <button data-tab="calendar">Calendar</button>
      <button data-tab="alerts">Alerts</button>
      <button data-tab="apps">Apps</button>
    </div>
    <div class="drawer-body" id="drawerBody"></div>
  </aside>

  <div class="modal" id="modal" hidden role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal-card">
      <div class="modal-h"><h3 id="modalTitle"></h3><button class="icon-btn" data-modal-close aria-label="Close"><svg class="ic"><use href="#i-x"/></svg></button></div>
      <div class="modal-body" id="modalBody"></div>
    </div>
  </div>

  <div class="toast" id="toast" hidden></div>

  <script src="/app.js" type="module"></script>
</body>
</html>
