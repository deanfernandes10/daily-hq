<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Daily HQ · Beta testers</title>
<style>
  :root { --bg: #070a11; --panel: #10172a; --panel-2: #18213a; --line: #26314d; --text: #e7ebf3; --muted: #a3adc2; --accent: #5b8cff; --up: #22c27a; --down: #ff5c6c; --warn: #f5b041; color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 Inter, system-ui, -apple-system, "Segoe UI", sans-serif; }
  .wrap { max-width: 1100px; margin: 0 auto; padding: calc(16px + env(safe-area-inset-top)) 18px 40px; }
  h1 { font-size: 22px; margin: 0; } h2 { font-size: 17px; margin: 0 0 10px; }
  .top { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; flex-wrap: wrap; }
  .logo { width: 40px; height: 40px; border-radius: 11px; display: grid; place-items: center; font-weight: 700; color: #fff; background: linear-gradient(135deg, #5b8cff, #7c5cff); }
  .grow { flex: 1; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 16px; margin-bottom: 16px; }
  input, select, textarea { font: inherit; color: var(--text); background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px; padding: 9px 11px; min-width: 0; }
  input:focus, select:focus { outline: none; border-color: var(--accent); }
  button { font: inherit; cursor: pointer; border: 1px solid var(--line); background: var(--panel-2); color: var(--text); border-radius: 10px; padding: 8px 12px; white-space: nowrap; }
  button:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  button.danger { color: var(--down); }
  button.sm { padding: 5px 9px; font-size: 13px; }
  .form { display: grid; grid-template-columns: 2fr 2fr 1fr 1fr auto; gap: 10px; align-items: end; }
  .form label { display: flex; flex-direction: column; gap: 4px; font-size: 12.5px; color: var(--muted); }
  @media (max-width: 760px) { .form { grid-template-columns: 1fr 1fr; } .form .full { grid-column: 1 / -1; } }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; margin-bottom: 16px; }
  .stat { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
  .stat span { display: block; font-size: 12.5px; color: var(--muted); } .stat b { font-size: 24px; font-weight: 600; }
  .tester { border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; margin-bottom: 10px; background: var(--panel-2); }
  .tester .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .tester .name { font-weight: 650; font-size: 16px; }
  .code { font: 600 14px "JetBrains Mono", ui-monospace, monospace; letter-spacing: .5px; }
  .pill { display: inline-block; border-radius: 999px; padding: 1px 9px; font-size: 12px; font-weight: 600; border: 1px solid currentColor; }
  .ok { color: var(--up); } .soon { color: var(--warn); } .off { color: var(--down); } .never { color: var(--muted); }
  .meta { color: var(--muted); font-size: 13px; margin-top: 4px; }
  .devices { margin-top: 8px; font-size: 13px; color: var(--muted); }
  .devices div { padding: 2px 0; }
  .acts { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
  .fb { border-bottom: 1px solid var(--line); padding: 10px 0; }
  .fb:last-child { border-bottom: 0; }
  .fb .who { font-size: 13px; color: var(--muted); }
  .fb p { margin: 4px 0 0; white-space: pre-wrap; }
  .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--text); color: var(--bg); padding: 9px 16px; border-radius: 10px; font-size: 14px; }
  .empty { color: var(--muted); padding: 10px 0; }
  .lock { max-width: 420px; margin: 12vh auto; text-align: center; }
  .lock input { width: 100%; margin: 14px 0 10px; text-align: center; }
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div class="toast" id="toast" hidden></div>
<script>
(() => {
  const SITE = location.origin;
  const $ = (s) => document.querySelector(s);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
  let key = localStorage.getItem("dhq.betaAdmin") || "";
  let data = null;
  const toast = (m) => { const t = $("#toast"); t.textContent = m; t.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => (t.hidden = true), 2500); };
  const day = 86400e3;
  const fmtDate = (ms) => new Date(ms).toLocaleDateString([], { month: "short", day: "numeric", year: "numeric" });
  const ago = (ms) => { const s = (Date.now() - ms) / 1000; if (s < 90) return "just now"; if (s < 3600) return Math.round(s / 60) + " min ago"; if (s < 86400) return Math.round(s / 3600) + " h ago"; return Math.round(s / 86400) + " days ago"; };
  const device = (ua) => /iPhone/.test(ua) ? "iPhone" : /iPad/.test(ua) ? "iPad" : /Android/.test(ua) ? "Android" : /Macintosh/.test(ua) ? "Mac" : /Windows/.test(ua) ? "Windows PC" : "Browser";
  const link = (code) => `${SITE}/?invite=${code}`;

  async function call(body) {
    const r = await fetch("/api/beta", { method: "POST", headers: { "content-type": "application/json", "x-beta-admin": key }, body: JSON.stringify(body) });
    const j = await r.json().catch(() => ({}));
    if (r.status === 401) { key = ""; localStorage.removeItem("dhq.betaAdmin"); lockScreen("That admin key didn't work."); throw new Error("locked"); }
    if (!r.ok) throw new Error(j.error || "Request failed");
    return j;
  }
  function copy(text, what) { navigator.clipboard.writeText(text).then(() => toast(`${what} copied`), () => prompt("Copy this:", text)); }

  function lockScreen(msg = "") {
    $("#app").innerHTML = `<div class="lock"><div class="logo" style="margin:0 auto 14px;width:56px;height:56px">HQ</div><h1>Beta testers</h1>
      <p class="meta">Enter your admin key to manage Daily HQ beta invites.</p>
      <form id="lk"><input id="k" type="password" placeholder="Admin key" autocomplete="current-password"><button class="primary" style="width:100%">Open</button></form>
      <p class="off" style="min-height:20px">${esc(msg)}</p></div>`;
    $("#lk").onsubmit = async (e) => { e.preventDefault(); key = $("#k").value.trim(); localStorage.setItem("dhq.betaAdmin", key); load(); };
  }

  async function load() {
    try { data = await call({ action: "list" }); render(); } catch (e) { if (e.message !== "locked") toast(e.message); }
  }

  function statusPill(i) {
    if (i.status === "revoked") return `<span class="pill off">Switched off</span>`;
    if (i.status === "expired") return `<span class="pill off">Ended ${fmtDate(i.expires)}</span>`;
    if (!i.expires) return `<span class="pill never">${i.owner ? "Owner · no end date" : "No end date"}</span>`;
    const d = Math.ceil((i.expires - Date.now()) / day);
    return `<span class="pill ${d <= 3 ? "soon" : "ok"}">Active · ${d} day${d === 1 ? "" : "s"} left (ends ${fmtDate(i.expires)})</span>`;
  }
  function message(i) {
    const first = (i.name || "").split(" ")[0];
    return `Hi ${first}, you're invited to try Daily HQ, my personal dashboard for scores, news, weather, markets and your calendar. It's a private beta${i.expires ? ` running until ${fmtDate(i.expires)}` : ""}.\n\n1. Open this link on your phone: ${link(i.code)}\n2. Set up your name, city and teams (takes a minute).\n3. Add it to your home screen when it offers.\n\nIf it asks for a code: ${i.code}\nTap "Beta · Feedback" at the top any time to tell me what you think.`;
  }

  function render() {
    const inv = data.invites, fb = data.feedback;
    const active = inv.filter((i) => i.status === "ok" && !i.owner);
    const devices = inv.reduce((a, i) => a + i.devices.length, 0);
    const week = inv.filter((i) => i.devices.some((d) => d.last > Date.now() - 7 * day) && !i.owner).length;
    $("#app").innerHTML = `
      <div class="top"><div class="logo">HQ</div><div class="grow"><h1>Beta testers</h1><div class="meta">Create invites, see who's using Daily HQ, and switch access off.</div></div>
        <button id="refresh">Refresh</button><button id="logout" class="sm">Lock</button></div>
      <div class="stats">
        <div class="stat"><span>Active testers</span><b>${active.length}</b></div>
        <div class="stat"><span>Used in the last 7 days</span><b>${week}</b></div>
        <div class="stat"><span>Devices signed in</span><b>${devices}</b></div>
        <div class="stat"><span>Feedback notes</span><b>${fb.length}</b></div>
      </div>
      <div class="card"><h2>Invite someone</h2>
        <form class="form" id="newInv">
          <label class="full">Name<input id="nName" placeholder="e.g. Mike Chen" required></label>
          <label class="full">Note (only you see this)<input id="nNote" placeholder="e.g. hockey dad, Android"></label>
          <label>Access for<select id="nDays"><option value="7">1 week</option><option value="14" selected>2 weeks</option><option value="30">30 days</option><option value="60">60 days</option><option value="90">90 days</option><option value="0">No end date</option></select></label>
          <label>Devices<select id="nDev"><option>1</option><option>2</option><option selected>3</option><option>5</option></select></label>
          <button class="primary">Create invite</button>
        </form>
      </div>
      <div class="card"><h2>Testers (${inv.length})</h2>${inv.length ? inv.map((i) => `
        <div class="tester">
          <div class="row"><span class="name">${esc(i.name)}</span><span class="code">${esc(i.code)}</span>${statusPill(i)}</div>
          ${i.note ? `<div class="meta">${esc(i.note)}</div>` : ""}
          <div class="meta">Invited ${fmtDate(i.created)} · ${i.devices.length} of ${i.owner ? "∞" : i.maxDevices} device${i.maxDevices === 1 ? "" : "s"}${i.devices.length ? ` · last opened ${ago(Math.max(...i.devices.map((d) => d.last)))} · ${i.devices.reduce((a, d) => a + (d.opens || 0), 0)} opens` : " · not used yet"}</div>
          ${i.devices.length ? `<div class="devices">${i.devices.map((d) => `<div>• ${device(d.ua)} — first ${fmtDate(d.first)}, last ${ago(d.last)}, ${d.opens || 0} opens</div>`).join("")}</div>` : ""}
          <div class="acts">
            <button class="sm" data-a="msg" data-c="${i.code}">Copy invite message</button>
            <button class="sm" data-a="link" data-c="${i.code}">Copy link</button>
            ${i.status !== "revoked" ? `<button class="sm" data-a="extend" data-c="${i.code}">+14 days</button>` : ""}
            ${i.status === "revoked" ? `<button class="sm" data-a="on" data-c="${i.code}">Switch back on</button>` : `<button class="sm danger" data-a="off" data-c="${i.code}">Switch off now</button>`}
            ${i.devices.length ? `<button class="sm" data-a="reset" data-c="${i.code}">Clear devices</button>` : ""}
            <button class="sm danger" data-a="del" data-c="${i.code}">Delete</button>
          </div>
        </div>`).join("") : `<div class="empty">No invites yet.</div>`}</div>
      <div class="card"><h2>Feedback (${fb.length})</h2>${fb.length ? fb.map((f) => `
        <div class="fb"><div class="who"><b>${esc(f.name)}</b> · ${esc({ idea: "💡 Idea", problem: "🐞 Problem", confusing: "🤔 Confusing", like: "👍 Likes", final: "🏁 Final notes" }[f.kind] || "Note")} · ${ago(f.at)} · ${esc(device(f.ua || ""))} · ${esc(f.version || "")}
          <button class="sm" style="float:right" data-a="delfb" data-id="${esc(f.id)}">Remove</button></div><p>${esc(f.text)}</p></div>`).join("") : `<div class="empty">No feedback yet. Testers send it from “Beta · Feedback” at the top of Daily HQ.</div>`}</div>`;

    $("#refresh").onclick = load;
    $("#logout").onclick = () => { localStorage.removeItem("dhq.betaAdmin"); key = ""; lockScreen(); };
    $("#newInv").onsubmit = async (e) => {
      e.preventDefault();
      try {
        const r = await call({ action: "create", name: $("#nName").value, note: $("#nNote").value, days: +$("#nDays").value, maxDevices: +$("#nDev").value });
        await load(); copy(message(r.invite), "Invite message for " + r.invite.name);
      } catch (e2) { if (e2.message !== "locked") toast(e2.message); }
    };
    document.querySelectorAll("[data-a]").forEach((b) => b.onclick = async () => {
      const a = b.dataset.a, i = inv.find((x) => x.code === b.dataset.c);
      try {
        if (a === "msg") return copy(message(i), "Invite message");
        if (a === "link") return copy(link(i.code), "Link");
        if (a === "extend") await call({ action: "update", code: i.code, patch: { expires: Math.max(Date.now(), i.expires || Date.now()) + 14 * day, revoked: false } });
        if (a === "off" && confirm(`Switch off ${i.name}'s access now? Daily HQ stops working for them the next time they open it.`)) await call({ action: "update", code: i.code, patch: { revoked: true } });
        if (a === "on") await call({ action: "update", code: i.code, patch: { revoked: false } });
        if (a === "reset" && confirm(`Clear ${i.name}'s devices? They can then use the invite on new devices.`)) await call({ action: "update", code: i.code, patch: { resetDevices: true } });
        if (a === "del" && confirm(`Delete ${i.name}'s invite completely? Their access ends and the record is removed.`)) await call({ action: "delete", code: i.code });
        if (a === "delfb") await call({ action: "delete-feedback", id: b.dataset.id });
        load();
      } catch (e) { if (e.message !== "locked") toast(e.message); }
    });
  }

  key ? load() : lockScreen();
})();
</script>
</body>
</html>
