<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-store">
<title>Updating Daily HQ…</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0b1020; color: #e8ecf5; font: 17px -apple-system, system-ui, sans-serif; text-align: center; }
  .box { padding: 24px; }
  .spin { width: 36px; height: 36px; margin: 0 auto 16px; border: 3px solid #2a3350; border-top-color: #5b8cff; border-radius: 50%; animation: s 0.8s linear infinite; }
  @keyframes s { to { transform: rotate(360deg); } }
  small { color: #8a94a8; display: block; margin-top: 8px; }
  a { color: #7fb0ff; }
</style>
</head>
<body>
<div class="box">
  <div class="spin"></div>
  <div id="msg">Updating Daily HQ to the latest version…</div>
  <small>Your settings and favorites are kept.</small>
</div>
<script>
// Clears the app's saved offline copy (service worker + caches) so the newest version loads.
// Settings live in localStorage and are not touched.
(async () => {
  try {
    if ("serviceWorker" in navigator) {
      const regs = await navigator.serviceWorker.getRegistrations();
      await Promise.all(regs.map((r) => r.unregister()));
    }
  } catch (e) {}
  try {
    if (window.caches) {
      const keys = await caches.keys();
      await Promise.all(keys.map((k) => caches.delete(k)));
    }
  } catch (e) {}
  document.getElementById("msg").textContent = "Done — opening Daily HQ…";
  setTimeout(() => location.replace("/?updated=" + Date.now()), 600);
})();
</script>
</body>
</html>
